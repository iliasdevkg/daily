user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $host [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # HTTP/2 needs this; compression + a bounded max body size (matches the
  # backend's own express.json({ limit: '100kb' }) — reject oversized
  # bodies at the edge instead of making the app do it).
  client_max_body_size 1m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;
  gzip_comp_level 6;

  # Security headers applied to every response proxied through here — a
  # second layer alongside the backend's own helmet() (defense in depth:
  # if a future route ever bypasses helmet, this still applies).
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # General rate limit at the edge — belt-and-suspenders with the
  # backend's own express-rate-limit; this one protects nginx/upstream
  # capacity even if a request never reaches the app layer.
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

  upstream backend_api {
    # Round-robins across every backend replica Docker Compose/Kubernetes
    # scales up — this is the load-balancing half of "Load Balancer" from
    # the architecture doc; nginx itself is the "Reverse Proxy" +
    # "API Gateway" half (single entry point, TLS termination, routing).
    server backend:3001;
    keepalive 32;
  }

  # ── api.<domain> — backend, including the SSE stream ─────────────────
  server {
    listen 80;
    server_name api.daily.kg;

    # Let's Encrypt HTTP-01 challenge path — certbot writes here, this
    # location must stay reachable over plain HTTP even after HTTPS
    # redirect is enabled below.
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name api.daily.kg;

    ssl_certificate     /etc/letsencrypt/live/api.daily.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.daily.kg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # SSE stream — must NOT be buffered (nginx buffering would hold each
    # event until a buffer fills, defeating "real-time") and needs a long
    # read timeout since a client can stay connected for hours with only
    # the 25s heartbeat (routes/events.js) keeping the socket alive.
    location /api/events {
      proxy_pass http://backend_api;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://backend_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      limit_req zone=general burst=40 nodelay;
      proxy_pass http://backend_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /metrics stays unauthenticated at the app layer (Prometheus scrapes
    # it directly) — at the edge it's restricted to the internal network
    # so it's never reachable from the public internet.
    location /metrics {
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      deny all;
      proxy_pass http://backend_api;
    }
  }

  # ── admin.<domain> — admin-web static SPA ─────────────────────────────
  server {
    listen 80;
    server_name admin.daily.kg;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }
  server {
    listen 443 ssl;
    http2 on;
    server_name admin.daily.kg;
    ssl_certificate     /etc/letsencrypt/live/admin.daily.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.daily.kg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
      proxy_pass http://admin-web:80;
      proxy_set_header Host $host;
    }
  }

  # ── daily.kg — customer web (frontend) ────────────────────────────────
  server {
    listen 80;
    server_name daily.kg www.daily.kg;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }
  server {
    listen 443 ssl;
    http2 on;
    server_name daily.kg www.daily.kg;
    ssl_certificate     /etc/letsencrypt/live/daily.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/daily.kg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
      proxy_pass http://frontend:80;
      proxy_set_header Host $host;
    }
  }
}
