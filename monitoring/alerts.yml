groups:
  - name: daily-backend
    rules:
      - alert: HighErrorRate
        expr: sum(rate(daily_http_requests_total{status_code=~"5.."}[5m])) / sum(rate(daily_http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "5xx error rate above 5%"
          description: "{{ $value | humanizePercentage }} of requests are failing with 5xx over the last 5 minutes."

      - alert: SlowResponses
        expr: histogram_quantile(0.95, sum(rate(daily_http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "p95 response time above 1s"

      - alert: AutomationErrorsSpiking
        expr: increase(daily_automation_errors_total[15m]) > 5
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "More than 5 automation errors in 15 minutes"
          description: "Check GET /api/settings/automation-errors — orders may be stuck."

      - alert: HighCpuUsage
        expr: rate(daily_process_cpu_seconds_total[5m]) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Backend process CPU usage above 90% for 10 minutes"

      - alert: HighMemoryUsage
        expr: daily_process_resident_memory_bytes / (1024 * 1024 * 1024) > 0.8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Backend process RSS above 800MB"

      - alert: InstanceDown
        expr: up{job="daily-backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Backend instance is not responding to scrapes"

  - name: infrastructure
    rules:
      - alert: HostHighCpu
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Host CPU usage above 85%"

      - alert: HostLowMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Host has less than 10% free memory"
          description: "This exact condition — machine running critically low on memory — caused a full system stall during this project's own development; see PRODUCTION_HARDENING_REPORT.md."

      - alert: HostLowDisk
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Host has less than 10% free disk space"

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "PostgreSQL is not reachable"

      - alert: PostgresTooManyConnections
        expr: sum(pg_stat_activity_count) / pg_settings_max_connections > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Postgres connection pool above 80% of max_connections"

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Redis is not reachable — bus.js/queue.js fall back to single-instance mode, breaking horizontal scaling silently"
