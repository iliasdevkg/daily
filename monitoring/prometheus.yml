global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  # backend/src/metrics.js exposes GET /metrics — no auth on it by design
  # (Prometheus itself has no bearer-token scrape config in the free/basic
  # setup), which is why nginx.conf restricts it to internal IP ranges at
  # the edge in production.
  - job_name: daily-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3001"]
        labels:
          service: daily-backend

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: [] # point at an Alertmanager instance to activate — see monitoring/alerts.yml
