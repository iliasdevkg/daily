# Matches nginx access.log lines (see nginx/nginx.conf's `main` log_format)
# for a 401/403/429 on /api/auth/* — repeated hits are a credential-
# stuffing or brute-force pattern, not normal traffic.
[Definition]
failregex = ^<HOST> - \S+ \[.*\] "(POST|GET) /api/auth/\S+ HTTP/\d\.\d" (401|403|429) .*$
ignoreregex =
