name: esy_delivery_app
description: "esy delivery — grocery delivery client"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: ^0.20.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.2.2
  url_launcher: ^6.3.1
  google_sign_in: ^6.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/stage_packing.png
    - assets/images/stage_transit.png
    - assets/images/stage_arrived.png
