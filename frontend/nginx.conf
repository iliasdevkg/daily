# Per-app static file server, sitting behind the main reverse-proxy nginx
# (see /nginx/nginx.conf at the repo root, which routes admin.daily.kg to
# this container). This one both serves the SPA's own build output AND
# proxies /api/* straight to the backend service — the app's own api.js
# calls a relative '/api' path (works in local dev via Vite's proxy), and
# without this, that same relative path would 404 in production since
# this container is served on a different domain (admin.daily.kg) than
# the backend (api.daily.kg). Proxying here means zero frontend code
# change was needed to make production routing work.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # SSE: same no-buffering/long-timeout requirements as the main
  # nginx.conf's /api/events block — must come before the generic /api/
  # location since nginx matches the most specific prefix.
  location /api/events {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://backend:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Long cache for hashed assets (vite names them content-hash.js/.css),
  # never cache index.html itself — otherwise a redeploy can leave a
  # browser stuck loading old JS/CSS chunk URLs that no longer exist.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback: any path that isn't a real file goes to index.html so
  # client-side routing (if this app ever adds any) doesn't 404 on refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
